[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibot2"
version = "3.2.0"
description = "Mavis MULTIBOT2 paper-trading bot"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "yfinance>=0.2.50,<1", "requests>=2.31,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = ["main","config","market_data","candles","trading","telegram","backtest","dashboard","yahoo_provider","signal_gate","strategy_engine","strategy_service","sweep_engine","reminders","db","news","calendar_store"]

[tool.setuptools.packages.find]
include = ["strategies*"]
