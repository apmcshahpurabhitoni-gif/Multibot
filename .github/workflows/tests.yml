name: MULTIBOT2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MULTIBOT2
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Import all runtime modules
        # Every top-level module is discovered rather than listed by hand: a
        # hand-maintained list silently stopped covering new modules, so a
        # broken import could reach main unnoticed.
        run: |
          python - <<'PY'
          import importlib, pathlib, sys
          root = pathlib.Path(".")
          modules = sorted(
              p.stem for p in root.glob("*.py")
              if p.stem not in {"setup", "conftest"} and not p.stem.startswith("_")
          )
          failed = []
          for name in modules:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append(f"{name}: {type(exc).__name__}: {exc}")
          print(f"imported {len(modules) - len(failed)}/{len(modules)} runtime modules")
          if failed:
              sys.exit("import failures:\n" + "\n".join(failed))
          PY
      - name: Run complete test suite
        run: pytest
