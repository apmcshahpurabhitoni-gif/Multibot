name: MULTIBOT2 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MULTIBOT2
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Import all runtime modules
        run: python -c "import backtest, candles, config, dashboard, db, main, market_data, reminders, signal_gate, strategies, sweep_engine, telegram, trading, yahoo_provider"
      - name: Run complete test suite
        run: pytest
